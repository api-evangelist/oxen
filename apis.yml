aid: oxen
name: Oxen
description: >-
  Oxen.ai is a blazing-fast data version control system and AI platform for teams
  building with their own data. Its open-source Rust core (liboxen) versions,
  branches, and shares terabyte-scale datasets, model weights, and experiments
  without Git's large-file limits. On top of the version control layer, Oxen.ai
  offers a unified, OpenAI-compatible inference API across 200+ text, image, video,
  and audio models, plus a fine-tuning API for training and deploying custom LLMs,
  vision-language, image, and video models. Developers work through a Python SDK
  (oxenai), a command-line tool (oxen), and an HTTP API for repository management,
  workspaces, data-frame diffing, generation queues, and model deployment.
