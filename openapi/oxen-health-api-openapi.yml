openapi: 3.2.0
info:
  description: Oxen is a fast, unstructured data version control, to help version large machine learning datasets written in Rust.
  license:
    name: ''
  title: oxen-server Health API
  version: 0.52.0
servers:
- description: Production API
  url: https://hub.oxen.ai
- description: Local Development
  url: http://localhost:3000
security:
- api_key: []
tags:
- name: Health
paths:
  /api/version:
    get:
      description: Check if the Oxen server is running and responsive.
      operationId: index
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
          description: Server is running
      summary: Check Oxen server status
      tags:
      - Health
components:
  schemas:
    StatusMessage:
      properties:
        oxen_version:
          type:
          - string
          - 'null'
        status:
          type: string
        status_message:
          type: string
      required:
      - status
      - status_message
      type: object
  securitySchemes:
    api_key:
      bearerFormat: JWT
      scheme: bearer
      type: http
