    GenerationsListResponse:
      description: Paginated browse view of past generations for a namespace. Includes the per-filter cost aggregate. Each row carries any additional request params (prompt, duration, etc.) merged in at the top level.
      properties:
        count:
          description: Number of entries in this response (<= page_size)
          type: integer
        generations:
          items:
            properties:
              completed_at:
                description: Unix timestamp
                nullable: true
                type: integer
              cost:
                description: Charged amount for this row (decimal as string).
                nullable: true
                type: string
              enqueued_at:
                description: Unix timestamp
                type: integer
              error_message:
                nullable: true
                type: string
              generation_id:
                format: uuid
                type: string
              media_type:
                enum:
                - image
                - video
                type: string
              model_name:
                type: string
              result_url:
                nullable: true
                type: string
              started_at:
                description: Unix timestamp
                nullable: true
                type: integer
              status:
                enum:
                - queued
                - processing
                - succeeded
                - failed
                - cancelled
                type: string
              target_directory:
                nullable: true
                type: string
              target_namespace:
                nullable: true
                type: string
              target_repo:
                nullable: true
                type: string
              user_id:
                format: uuid
                nullable: true
                type: string
              user_image:
                nullable: true
                type: string
              username:
                nullable: true
                type: string
            required:
            - generation_id
            - model_name
            - media_type
            - status
            - enqueued_at
            type: object
          type: array
        page_number:
          description: Current page number (1-indexed)
          type: integer
        page_size:
          type: integer
        total_cost:
          description: Sum of charged amounts across the filter set (decimal as string). Null when nothing in the set has been charged.
          nullable: true
          type: string
        total_entries:
          type: integer
        total_pages:
          type: integer
      required:
